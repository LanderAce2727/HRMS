<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Create an applicant account | DNSC Smart HRMS</title>
    <link rel="stylesheet" href="../assets/demo.css" />
  </head>
  <body>
    <div class="demo-layout">
      <aside class="demo-sidebar">
        <div class="demo-brand">
          <div
            class="demo-logo"
            aria-label="Blank school logo placeholder"
          ></div>
          <div>DNSC<small>SMART HRMS</small></div>
        </div>
        <button class="demo-button demo-menu" data-menu aria-expanded="false">
          Toggle menu
        </button>
        <nav
          data-demo-sidebar="authentication"
          aria-label="Section pages"
        ></nav>
        <p>DNSC Smart HRMS<br />Human Resource Management</p>
      </aside>
      <main class="demo-main">
        <header class="demo-heading">
          <h1>Create an applicant account</h1>
          <p>Join the DNSC applicant portal.</p>
        </header>
        <section class="demo-panel">
          <h2>Applicant information</h2>
          <form
            class="demo-form"
            data-next="authentication/Authentication_Account_Verification.html"
            novalidate
          >
            <label
              >Full name<input
                type="text"
                placeholder="Your full name" /></label
            ><label
              >Email address<input
                type="email"
                placeholder="name@example.com" /></label
            ><label
              >Password<input
                type="password"
                placeholder="Enter a password" /></label
            ><label>Contact number<input type="tel" placeholder="" /></label
            ><label
              >Resume (optional PDF)<input
                type="file"
                placeholder=""
                accept=".pdf"
            /></label>
            <div>
              <button class="demo-button primary" type="submit">
                Create account
              </button>
            </div>
          </form>
        </section>
      </main>
    </div>
    <script src="../assets/demo.js"></script>
  </body>
</html>
