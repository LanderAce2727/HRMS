<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Account verification | DNSC Smart HRMS</title>
    <link rel="stylesheet" href="../assets/demo.css" />
  </head>
  <body>
    <div class="demo-layout">
      <aside class="demo-sidebar">
        <div class="demo-brand">
          <div
            class="demo-logo"
            aria-label="Blank school logo placeholder"
          ></div>
          <div>DNSC<small>SMART HRMS</small></div>
        </div>
        <button class="demo-button demo-menu" data-menu aria-expanded="false">
          Toggle menu
        </button>
        <nav
          data-demo-sidebar="authentication"
          aria-label="Section pages"
        ></nav>
        <p>DNSC Smart HRMS<br />Human Resource Management</p>
      </aside>
      <main class="demo-main">
        <header class="demo-heading">
          <h1>Account verification</h1>
          <p>Verify your account and continue to your portal.</p>
        </header>
        <section class="demo-panel">
          <h2>Verify your account</h2>
          <form
            class="demo-form"
            data-next="applicant/Applicant_Job_Listings.html"
            novalidate
          >
            <label>Email address<input type="email" placeholder="" /></label
            ><label
              >Verification code<input
                type="text"
                placeholder="Verification code"
            /></label>
            <div>
              <button class="demo-button primary" type="submit">
                Continue to applicant portal
              </button>
            </div>
          </form>
          <div class="demo-actions">
            <a
              class="demo-button"
              href="../student/Student_Verification_Status.html"
              >Student verification</a
            ><a
              class="demo-button"
              href="../authentication/Authentication_Login.html"
              >Back to login</a
            >
          </div>
        </section>
      </main>
    </div>
    <script src="../assets/demo.js"></script>
  </body>
</html>
