<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Student registration | DNSC Smart HRMS</title>
    <link rel="stylesheet" href="../assets/demo.css" />
  </head>
  <body>
    <div class="demo-layout">
      <aside class="demo-sidebar">
        <div class="demo-brand">
          <div
            class="demo-logo"
            aria-label="Blank school logo placeholder"
          ></div>
          <div>DNSC<small>SMART HRMS</small></div>
        </div>
        <button class="demo-button demo-menu" data-menu aria-expanded="false">
          Toggle menu
        </button>
        <nav
          data-demo-sidebar="authentication"
          aria-label="Section pages"
        ></nav>
        <p>DNSC Smart HRMS<br />Human Resource Management</p>
      </aside>
      <main class="demo-main">
        <header class="demo-heading">
          <h1>Student registration</h1>
          <p>Access faculty evaluation.</p>
        </header>
        <section class="demo-panel">
          <h2>Student details</h2>
          <form
            class="demo-form"
            data-next="student/Student_Verification_Status.html"
            novalidate
          >
            <label
              >Student number<input
                type="text"
                placeholder="2026-00123" /></label
            ><label
              >Full name<input type="text" placeholder="Student name" /></label
            ><label
              >School email<input
                type="email"
                placeholder="student@dnsc.edu.ph" /></label
            ><label
              >Program<select>
                <option>BS Information Technology</option>
                <option>BS Education</option>
                <option>BS Business Administration</option>
              </select></label
            ><label
              >Year level<select>
                <option>1st year</option>
                <option>2nd year</option>
                <option>3rd year</option>
                <option>4th year</option>
              </select></label
            >
            <div>
              <button class="demo-button primary" type="submit">
                Continue to verification
              </button>
            </div>
          </form>
        </section>
      </main>
    </div>
    <script src="../assets/demo.js"></script>
  </body>
</html>
